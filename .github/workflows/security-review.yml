name: Security and privacy review

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-review-${{ github.ref }}
  cancel-in-progress: true

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  security-review:
    name: security-review
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install checksum-verified scanner
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' > "$scanner_dir/checksum"
          (cd "$scanner_dir" && sha256sum --check checksum && tar -xzf gitleaks.tar.gz gitleaks)
          echo "$scanner_dir" >> "$GITHUB_PATH"
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
      - name: Test scanner redaction, exceptions, archives, and portable manifests
        run: python3 -m unittest discover -s scripts/security -p 'test_*.py' -v
      - name: Scan tracked files, document contents, and complete reachable Git history
        run: python3 scripts/security/review.py
      - name: Install build dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build actual Pages artifact
        run: npm run build:pages
      - name: Scan everything that will be deployed
        run: python3 scripts/security/review.py --directory dist
